<!DOCTYPE html>
<html lang="zh-TW">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>VideoCut - 極簡影音工具</title>
  <!-- FFmpeg.wasm 核心檔案（優先載入本地，備用 jsdelivr CDN） -->
  <script src="./ffmpeg.min.js" onerror="this.onerror=null;this.src='https://cdn.jsdelivr.net/npm/@ffmpeg/ffmpeg@0.11.6/dist/ffmpeg.min.js'"></script>
  <style>
    :root {
      --bg: #0f172a;
      --card-bg: #1e293b;
      --card-border: #334155;
      --text-main: #f8fafc;
      --text-sub: #94a3b8;
      --primary: #3b82f6;
      --primary-hover: #2563eb;
      --accent: #10b981;
      --accent-hover: #059669;
      --danger: #ef4444;
      --input-bg: #0f172a;
    }

    * {
      box-sizing: border-box;
      margin: 0;
      padding: 0;
      font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", Roboto, "Helvetica Neue", Arial, sans-serif;
    }

    body {
      background-color: var(--bg);
      color: var(--text-main);
      min-height: 100vh;
      display: flex;
      flex-direction: column;
      align-items: center;
      padding: 2rem 1rem;
    }

    .container {
      width: 100%;
      max-width: 760px;
    }

    header {
      text-align: center;
      margin-bottom: 1.5rem;
    }

    header h1 {
      font-size: 1.85rem;
      font-weight: 700;
      letter-spacing: -0.025em;
      margin-bottom: 0.35rem;
    }

    header p {
      color: var(--text-sub);
      font-size: 0.95rem;
    }

    /* Core Status */
    .status-badge {
      display: inline-flex;
      align-items: center;
      gap: 0.4rem;
      padding: 0.25rem 0.75rem;
      border-radius: 9999px;
      font-size: 0.8rem;
      margin-top: 0.6rem;
      background-color: #1e293b;
      border: 1px solid var(--card-border);
      color: var(--text-sub);
    }
    .status-dot {
      width: 8px;
      height: 8px;
      border-radius: 50%;
      background-color: #eab308;
    }
    .status-dot.ready { background-color: var(--accent); }
    .status-dot.busy { background-color: var(--primary); animation: pulse 1.2s infinite; }
    .status-dot.error { background-color: var(--danger); }

    @keyframes pulse {
      0%, 100% { opacity: 1; }
      50% { opacity: 0.4; }
    }

    /* Main Tabs */
    .tabs {
      display: flex;
      background: var(--card-bg);
      padding: 0.35rem;
      border-radius: 0.75rem;
      border: 1px solid var(--card-border);
      margin-bottom: 1.5rem;
      gap: 0.35rem;
    }

    .tab-btn {
      flex: 1;
      padding: 0.75rem 0.5rem;
      background: transparent;
      border: none;
      color: var(--text-sub);
      font-size: 0.95rem;
      font-weight: 600;
      border-radius: 0.5rem;
      cursor: pointer;
      transition: all 0.2s ease;
      text-align: center;
    }

    .tab-btn.active {
      background: var(--primary);
      color: #fff;
      box-shadow: 0 4px 12px rgba(59, 130, 246, 0.25);
    }

    /* Card Panels */
    .panel {
      display: none;
      background: var(--card-bg);
      border: 1px solid var(--card-border);
      border-radius: 1rem;
      padding: 1.75rem;
      box-shadow: 0 10px 25px -5px rgba(0, 0, 0, 0.3);
    }
    .panel.active {
      display: block;
    }

    /* Form & Dropzones */
    .form-group {
      margin-bottom: 1.25rem;
    }

    label {
      display: block;
      font-size: 0.875rem;
      font-weight: 500;
      color: var(--text-sub);
      margin-bottom: 0.4rem;
    }

    .dropzone {
      border: 2px dashed var(--card-border);
      border-radius: 0.75rem;
      padding: 1.5rem;
      text-align: center;
      cursor: pointer;
      background: var(--input-bg);
      transition: border-color 0.2s, background-color 0.2s;
      position: relative;
    }
    .dropzone:hover, .dropzone.dragover {
      border-color: var(--primary);
      background-color: rgba(59, 130, 246, 0.05);
    }
    .dropzone input[type="file"] {
      position: absolute;
      top: 0;
      left: 0;
      width: 100%;
      height: 100%;
      opacity: 0;
      cursor: pointer;
    }
    .dropzone .file-name {
      font-size: 0.95rem;
      color: var(--text-main);
      font-weight: 500;
      margin-top: 0.25rem;
      word-break: break-all;
    }
    .dropzone .hint {
      font-size: 0.8rem;
      color: var(--text-sub);
    }

    /* Timeline & Video Preview */
    .timeline-container {
      position: relative;
      margin-top: 0.5rem;
      margin-bottom: 1.25rem;
      background: var(--input-bg);
      border: 1px solid var(--card-border);
      border-radius: 0.75rem;
      padding: 1rem;
    }

    .btn-remove-video {
      position: absolute;
      top: 0.75rem;
      right: 0.75rem;
      width: 28px;
      height: 28px;
      border-radius: 50%;
      background: rgba(239, 68, 68, 0.15);
      border: 1px solid rgba(239, 68, 68, 0.4);
      color: #ef4444;
      font-size: 1rem;
      font-weight: bold;
      display: flex;
      align-items: center;
      justify-content: center;
      cursor: pointer;
      transition: all 0.2s ease;
      line-height: 1;
      z-index: 5;
    }
    .btn-remove-video:hover {
      background: #ef4444;
      border-color: #ef4444;
      color: #ffffff;
      transform: scale(1.1);
    }

    .time-input-inline {
      width: 82px;
      padding: 0.2rem 0.4rem;
      background: #0f172a;
      border: 1px solid #334155;
      border-radius: 0.35rem;
      color: var(--text-main);
      font-family: ui-monospace, SFMono-Regular, Menlo, Monaco, Consolas, monospace;
      font-size: 0.85rem;
      font-weight: 600;
      text-align: center;
      outline: none;
      transition: border-color 0.2s;
    }
    .time-input-inline:focus {
      border-color: var(--primary);
    }

    /* Command Card (圖二風格) */
    .cmd-card {
      margin-top: 1.5rem;
      background: #1e293b;
      border: 1px solid var(--card-border);
      border-radius: 0.65rem;
      padding: 0.85rem 1rem 1rem 1rem;
    }

    .cmd-header {
      display: flex;
      justify-content: space-between;
      align-items: center;
      margin-bottom: 0.65rem;
    }

    .cmd-title {
      color: #22c55e;
      font-weight: 700;
      font-size: 0.85rem;
      letter-spacing: 0.02em;
      flex: 1;
      margin-right: 0.75rem;
      line-height: 1.4;
    }

    .btn-copy {
      padding: 0.3rem 0.85rem;
      font-size: 0.825rem;
      font-weight: 500;
      color: #f8fafc;
      background: #334155;
      border: 1px solid #475569;
      border-radius: 0.4rem;
      cursor: pointer;
      transition: all 0.2s;
    }
    .btn-copy:hover {
      background: var(--primary);
      border-color: var(--primary);
      color: #fff;
    }

    .cmd-terminal {
      background: #000000;
      border: 1px solid #0f172a;
      border-radius: 0.5rem;
      padding: 0.85rem 1rem;
      text-align: left;
    }

    .cmd-terminal code {
      display: block;
      font-family: ui-monospace, SFMono-Regular, Menlo, Monaco, Consolas, monospace;
      font-size: 0.875rem;
      color: #f8fafc;
      text-align: left;
      line-height: 1.6;
      word-break: break-all;
      white-space: pre-wrap;
      margin: 0;
      padding: 0;
    }

    .video-preview-box {
      width: 100%;
      max-height: 290px;
      background: #000;
      border-radius: 0.5rem;
      overflow: hidden;
      display: flex;
      justify-content: center;
      align-items: center;
      margin-bottom: 0.85rem;
    }

    .video-preview-box video {
      width: 100%;
      max-height: 290px;
      object-fit: contain;
    }

    .timeline-bar-wrapper {
      position: relative;
      width: 100%;
      height: 30px;
      margin: 0.75rem 0 0.5rem 0;
    }

    .timeline-track-bg {
      position: absolute;
      top: 11px;
      left: 0;
      right: 0;
      height: 8px;
      background: #334155;
      border-radius: 4px;
    }

    .timeline-track-selected {
      position: absolute;
      top: 11px;
      height: 8px;
      background: var(--primary);
      border-radius: 4px;
      pointer-events: none;
    }

    .timeline-bar-wrapper input[type="range"] {
      position: absolute;
      top: 0;
      left: 0;
      width: 100%;
      height: 30px;
      margin: 0;
      background: none;
      pointer-events: none;
      -webkit-appearance: none;
      appearance: none;
    }

    .timeline-bar-wrapper input[type="range"]::-webkit-slider-thumb {
      -webkit-appearance: none;
      appearance: none;
      pointer-events: auto;
      width: 16px;
      height: 26px;
      background: #ffffff;
      border: 2px solid var(--primary);
      border-radius: 4px;
      cursor: ew-resize;
      box-shadow: 0 2px 6px rgba(0, 0, 0, 0.5);
      transition: transform 0.1s, background-color 0.1s;
    }
    .timeline-bar-wrapper input[type="range"]::-webkit-slider-thumb:hover {
      transform: scale(1.15);
      background-color: #dbeafe;
    }
    .timeline-bar-wrapper input[type="range"]::-moz-range-thumb {
      pointer-events: auto;
      width: 16px;
      height: 26px;
      background: #ffffff;
      border: 2px solid var(--primary);
      border-radius: 4px;
      cursor: ew-resize;
      box-shadow: 0 2px 6px rgba(0, 0, 0, 0.5);
    }

    .timeline-details {
      display: flex;
      justify-content: space-between;
      align-items: center;
      flex-wrap: wrap;
      gap: 0.5rem;
      font-size: 0.85rem;
      color: var(--text-sub);
      margin-top: 0.25rem;
    }

    .time-badge {
      font-variant-numeric: tabular-nums;
      color: var(--text-main);
      font-weight: 600;
    }

    .timeline-actions {
      display: flex;
      gap: 0.4rem;
    }

    .btn-micro {
      padding: 0.3rem 0.6rem;
      background: #334155;
      border: none;
      border-radius: 0.35rem;
      color: var(--text-main);
      font-size: 0.78rem;
      cursor: pointer;
      transition: background 0.15s;
    }
    .btn-micro:hover {
      background: #475569;
    }

    .duration-indicator {
      font-size: 0.8rem;
      color: var(--text-sub);
      text-align: center;
      margin-top: 0.4rem;
    }

    /* Sub Mode Toggle (剪切/拆解 vs 轉動畫) */
    .mode-toggle {
      display: flex;
      background: #0f172a;
      border: 1px solid var(--card-border);
      border-radius: 0.5rem;
      padding: 0.25rem;
      margin-top: 1.5rem;
      margin-bottom: 1rem;
      gap: 0.25rem;
    }

    .mode-btn {
      flex: 1;
      padding: 0.5rem;
      border: none;
      border-radius: 0.375rem;
      background: transparent;
      color: var(--text-sub);
      font-size: 0.875rem;
      font-weight: 600;
      cursor: pointer;
      transition: all 0.2s;
    }

    .mode-btn.active {
      background: #334155;
      color: var(--text-main);
    }

    /* Action Buttons */
    .button-group {
      display: flex;
      flex-wrap: wrap;
      gap: 0.75rem;
    }

    button.btn {
      flex: 1;
      min-width: 130px;
      padding: 0.75rem 1rem;
      border: none;
      border-radius: 0.5rem;
      font-size: 0.925rem;
      font-weight: 600;
      cursor: pointer;
      transition: all 0.2s ease;
      display: inline-flex;
      align-items: center;
      justify-content: center;
      gap: 0.4rem;
    }

    button.btn-primary {
      background: var(--primary);
      color: white;
    }
    button.btn-primary:hover:not(:disabled) {
      background: var(--primary-hover);
    }

    button.btn-secondary {
      background: #334155;
      color: white;
    }
    button.btn-secondary:hover:not(:disabled) {
      background: #475569;
    }

    button.btn-accent {
      background: var(--accent);
      color: white;
    }
    button.btn-accent:hover:not(:disabled) {
      background: var(--accent-hover);
    }

    button.btn:disabled {
      opacity: 0.5;
      cursor: not-allowed;
    }

    .grid-2 {
      display: grid;
      grid-template-columns: 1fr 1fr;
      gap: 1rem;
    }

    select {
      width: 100%;
      padding: 0.65rem 0.75rem;
      background: var(--input-bg);
      border: 1px solid var(--card-border);
      border-radius: 0.5rem;
      color: var(--text-main);
      font-size: 0.9rem;
      outline: none;
    }
    select:focus {
      border-color: var(--primary);
    }

    /* Logs & Progress */
    .progress-box {
      margin-top: 1.5rem;
      padding: 1rem;
      border-radius: 0.5rem;
      background: var(--input-bg);
      border: 1px solid var(--card-border);
      display: none;
    }

    .progress-header {
      display: flex;
      justify-content: space-between;
      font-size: 0.85rem;
      margin-bottom: 0.5rem;
      color: var(--text-sub);
    }

    .progress-bar-bg {
      width: 100%;
      height: 6px;
      background: #334155;
      border-radius: 3px;
      overflow: hidden;
    }
    .progress-bar-fill {
      height: 100%;
      width: 0%;
      background: var(--primary);
      transition: width 0.2s ease;
    }

    /* Result Area */
    .result-box {
      margin-top: 1.5rem;
      padding: 1.25rem;
      background: rgba(16, 185, 129, 0.1);
      border: 1px solid rgba(16, 185, 129, 0.3);
      border-radius: 0.75rem;
      display: none;
      text-align: center;
    }

    .result-box a.download-link {
      display: inline-flex;
      align-items: center;
      gap: 0.5rem;
      padding: 0.75rem 1.5rem;
      background: var(--accent);
      color: white;
      text-decoration: none;
      font-weight: 600;
      border-radius: 0.5rem;
      margin-top: 0.75rem;
      transition: background 0.2s;
    }
    .result-box a.download-link:hover {
      background: var(--accent-hover);
    }

    .preview-container {
      margin-top: 1rem;
      max-width: 100%;
    }
    .preview-container img, .preview-container video {
      max-width: 100%;
      max-height: 320px;
      border-radius: 0.5rem;
      border: 1px solid var(--card-border);
    }

    footer {
      margin-top: auto;
      padding-top: 2rem;
      color: var(--text-sub);
      font-size: 0.8rem;
      text-align: center;
    }
  </style>
</head>
<body>

  <div class="container">
    <header>
      <h1>🎬 VideoCut</h1>
      <p>極簡純靜態影音工具</p>
    </header>

    <!-- 頂部兩大功能頁籤 -->
    <div class="tabs">
      <button class="tab-btn active" onclick="switchMainTab('splitTab', this)">1. 影片處理 (分割 / 抽取 / 動畫)</button>
      <button class="tab-btn" onclick="switchMainTab('muxTab', this)">2. 合併影音</button>
    </div>

    <!-- 頁面 1: 影片處理 (整合剪切、拆軌與轉動畫) -->
    <div id="splitTab" class="panel active">
      <div class="form-group" id="splitDropGroup">
        <label>選取影片</label>
        <div class="dropzone" id="splitDropzone">
          <input type="file" id="splitFile" accept="video/*,.mkv,.mp4,.mov,.webm,.avi">
          <div class="hint">點擊選取或拖曳影片至此</div>
          <div class="file-name" id="splitFileName"></div>
        </div>
      </div>

      <!-- 共用時間軸預覽 -->
      <div class="timeline-container" id="splitTimelineBox" style="display: none;">
        <button type="button" class="btn-remove-video" onclick="resetSplitVideo()" title="重新選取影片">✕</button>
        <label>時間軸預覽與範圍選取</label>
        <div class="video-preview-box">
          <video id="splitVideo" controls playsinline></video>
        </div>

        <div class="timeline-bar-wrapper">
          <div class="timeline-track-bg"></div>
          <div class="timeline-track-selected" id="splitTrackHighlight"></div>
          <input type="range" id="splitSliderStart" min="0" max="100" step="0.05" value="0">
          <input type="range" id="splitSliderEnd" min="0" max="100" step="0.05" value="100">
        </div>

        <div class="timeline-details">
          <div>起點: <input type="text" class="time-input-inline" id="splitStartInput" value="00:00.0"></div>
          <div class="timeline-actions">
            <button type="button" class="btn-micro" onclick="setMarker('start')">設為起點</button>
            <button type="button" class="btn-micro" onclick="previewSegment()">預覽區間</button>
            <button type="button" class="btn-micro" onclick="setMarker('end')">設為終點</button>
          </div>
          <div>終點: <input type="text" class="time-input-inline" id="splitEndInput" value="00:00.0"></div>
        </div>
        <div class="duration-indicator" id="splitDurationText">選取長度: 0.0 秒</div>
      </div>

      <!-- 子模式切換 (剪切/拆解 vs 轉動畫) -->
      <div class="mode-toggle">
        <button type="button" class="mode-btn active" onclick="switchSubMode('cut', this)">✂️ 剪切 / 抽取</button>
        <button type="button" class="mode-btn" onclick="switchSubMode('anim', this)">✨ 轉為動畫</button>
      </div>

      <!-- 操作按鈕區 1: 剪切與拆軌 -->
      <div id="cutActions">
        <div class="button-group">
          <button class="btn btn-secondary" onclick="handleSplit('audio')">
            🎵 抽取聲音
          </button>
          <button class="btn btn-secondary" onclick="handleSplit('video')">
            🔇 抽取畫面
          </button>
          <button class="btn btn-primary" onclick="handleSplit('both')">
            ✂️ 剪切片段
          </button>
        </div>
      </div>

      <!-- 操作按鈕區 2: 轉為動畫 -->
      <div id="animActions" style="display: none;">
        <div class="grid-2" style="margin-bottom: 1rem;">
          <div class="form-group" style="margin-bottom: 0;">
            <label>動畫寬度</label>
            <select id="animWidth">
              <option value="320">320 px (輕量)</option>
              <option value="480" selected>480 px (建議預設)</option>
              <option value="640">640 px (高畫質)</option>
              <option value="-1">原尺寸</option>
            </select>
          </div>
          <div class="form-group" style="margin-bottom: 0;">
            <label>影格率 (FPS)</label>
            <select id="animFps">
              <option value="10">10 FPS (小檔案)</option>
              <option value="15" selected>15 FPS (順暢)</option>
              <option value="24">24 FPS (高流暢)</option>
            </select>
          </div>
        </div>

        <div class="form-group">
          <label>輸出格式</label>
          <select id="animFormat">
            <option value="gif" selected>GIF 動畫 (最佳相容性，高階調色盤防雜點)</option>
            <option value="webp">WebP 動畫 (高畫質、檔案更小)</option>
          </select>
        </div>

        <div class="button-group">
          <button class="btn btn-accent" onclick="handleMakeAnimation()">
            ✨ 開始轉為動畫
          </button>
        </div>
      </div>
    </div>

    <!-- 頁面 2: 合併影音 -->
    <div id="muxTab" class="panel">
      <div class="form-group">
        <label>1. 選取影片 (畫面來源)</label>
        <div class="dropzone" id="muxVideoDropzone">
          <input type="file" id="muxVideoFile" accept="video/*,.mkv,.mp4,.mov,.webm">
          <div class="hint">點擊或拖入影片檔</div>
          <div class="file-name" id="muxVideoFileName"></div>
        </div>
      </div>

      <div class="form-group">
        <label>2. 選取聲音 (音訊來源)</label>
        <div class="dropzone" id="muxAudioDropzone">
          <input type="file" id="muxAudioFile" accept="audio/*,.mp3,.aac,.m4a,.wav,.ogg,.flac">
          <div class="hint">點擊或拖入聲音檔</div>
          <div class="file-name" id="muxAudioFileName"></div>
        </div>
      </div>

      <div class="button-group">
        <button class="btn btn-primary" onclick="handleMux()">
          🔗 合併影音
        </button>
      </div>
    </div>

    <!-- 進度與處理狀態 -->
    <div class="progress-box" id="progressBox">
      <div class="progress-header">
        <span id="progressMessage">處理中...</span>
        <span id="progressPercent">0%</span>
      </div>
      <div class="progress-bar-bg">
        <div class="progress-bar-fill" id="progressBar"></div>
      </div>
    </div>

    <!-- 輸出與下載成果 -->
    <div class="result-box" id="resultBox">
      <div style="font-weight: 600; color: var(--accent); margin-bottom: 0.5rem;">
        ✅ 完成！
      </div>
      <div class="preview-container" id="previewContainer"></div>
      <a href="#" class="download-link" id="downloadBtn" download="output">
        💾 下載檔案 (<span id="resultFileSize">0 MB</span>)
      </a>
    </div>

    <!-- 本機終端機指令區 (風格同圖二) -->
    <div class="cmd-card" id="cmdBox">
      <div class="cmd-header">
        <span class="cmd-title">FFmpeg 指令 ( 檔案大於 900MB，受瀏覽器記憶體物理限制，請使用指令)</span>
        <button type="button" class="btn-copy" id="btnCopyCmd" onclick="copyCommandLine()">複製</button>
      </div>
      <div class="cmd-terminal">
        <code id="cmdText">ffmpeg -hide_banner -loglevel error -stats -y -i "影片.mp4" -c copy "影片_cut.mp4"</code>
      </div>
    </div>

    <footer>
      VideoCut ・ 極簡純靜態影音工具
    </footer>
  </div>

  <script>
    const { createFFmpeg, fetchFile } = FFmpeg;
    let ffmpeg = null;
    let isReady = false;
    let isProcessing = false;

    let currentTab = 'splitTab';
    let currentSubMode = 'cut';
    let activeAction = 'cut';

    function setButtonsDisabled(disabled) {
      document.querySelectorAll('button.btn').forEach(btn => {
        btn.disabled = disabled;
      });
    }

    function safeUnlink(fileName) {
      if (!ffmpeg) return;
      try { ffmpeg.FS('unlink', fileName); } catch (e) {}
    }

    const progressBox = document.getElementById('progressBox');
    const progressBar = document.getElementById('progressBar');
    const progressPercent = document.getElementById('progressPercent');
    const progressMessage = document.getElementById('progressMessage');
    const resultBox = document.getElementById('resultBox');
    const downloadBtn = document.getElementById('downloadBtn');
    const previewContainer = document.getElementById('previewContainer');
    const resultFileSize = document.getElementById('resultFileSize');

    function formatTime(sec) {
      if (isNaN(sec) || sec < 0) return '00:00.0';
      const m = Math.floor(sec / 60);
      const s = Math.floor(sec % 60);
      const ms = Math.floor((sec % 1) * 10);
      const mm = m < 10 ? '0' + m : m;
      const ss = s < 10 ? '0' + s : s;
      return `${mm}:${ss}.${ms}`;
    }

    function formatTimeCmd(sec) {
      if (isNaN(sec) || sec < 0) return '00:00:00.0';
      const h = Math.floor(sec / 3600);
      const m = Math.floor((sec % 3600) / 60);
      const s = Math.floor(sec % 60);
      const ms = Math.floor((sec % 1) * 10);
      const hh = h < 10 ? '0' + h : h;
      const mm = m < 10 ? '0' + m : m;
      const ss = s < 10 ? '0' + s : s;
      return `${hh}:${mm}:${ss}.${ms}`;
    }

    function parseTimeToSec(str) {
      if (!str) return 0;
      str = str.trim();
      const parts = str.split(':');
      if (parts.length === 3) {
        return (parseFloat(parts[0]) || 0) * 3600 + (parseFloat(parts[1]) || 0) * 60 + (parseFloat(parts[2]) || 0);
      } else if (parts.length === 2) {
        return (parseFloat(parts[0]) || 0) * 60 + (parseFloat(parts[1]) || 0);
      } else {
        return parseFloat(str) || 0;
      }
    }

    function formatBytes(bytes) {
      if (!bytes || bytes === 0) return '0 B';
      const k = 1024;
      const sizes = ['B', 'KB', 'MB', 'GB'];
      const i = Math.floor(Math.log(bytes) / Math.log(k));
      return (bytes / Math.pow(k, i)).toFixed(2) + ' ' + sizes[i];
    }

    function getExt(filename) {
      if (!filename) return '';
      const idx = filename.lastIndexOf('.');
      return idx !== -1 ? filename.substring(idx) : '';
    }

    function getBaseName(filename) {
      if (!filename) return '';
      const idx = filename.lastIndexOf('.');
      return idx !== -1 ? filename.substring(0, idx) : filename;
    }

    function resolvePaths(filePathVal, fallbackFile, defaultName = '影片.mp4') {
      let raw = (filePathVal && filePathVal.trim()) ? filePathVal.trim() : '';
      if (!raw) {
        if (fallbackFile) {
          raw = fallbackFile.path || fallbackFile.name;
        } else {
          raw = defaultName;
        }
      }

      raw = raw.replace(/^["']|["']$/g, '');
      const ext = getExt(raw) || (fallbackFile ? getExt(fallbackFile.name) : '') || '.mp4';
      const lastSlash = Math.max(raw.lastIndexOf('/'), raw.lastIndexOf('\\'));
      let dir = '';
      let filenameWithExt = raw;
      if (lastSlash !== -1) {
        dir = raw.substring(0, lastSlash + 1);
        filenameWithExt = raw.substring(lastSlash + 1);
      }

      const base = getBaseName(filenameWithExt);
      const fullInput = raw;
      const fullOutputBase = dir ? `${dir}${base}` : base;

      return { fullInput, fullOutputBase, ext, dir, base };
    }

    // 初始化 FFmpeg 核心（採用免 SharedArrayBuffer 的單執行緒核心，全面相容 GitHub Pages）
    async function initFFmpeg() {
      if (isReady) return;
      const isHttp = window.location.protocol.startsWith('http');
      const candidates = isHttp
        ? [
            'https://cdn.jsdelivr.net/npm/@ffmpeg/core-st@0.11.1/dist/ffmpeg-core.js',
            'https://unpkg.com/@ffmpeg/core-st@0.11.1/dist/ffmpeg-core.js',
            new URL('ffmpeg-core.js', window.location.href).href
          ]
        : [
            'https://cdn.jsdelivr.net/npm/@ffmpeg/core-st@0.11.1/dist/ffmpeg-core.js',
            'https://unpkg.com/@ffmpeg/core-st@0.11.1/dist/ffmpeg-core.js'
          ];

      for (let i = 0; i < candidates.length; i++) {
        const path = candidates[i];
        try {
          ffmpeg = createFFmpeg({
            log: false,
            corePath: path,
            mainName: 'main'
          });

          ffmpeg.setProgress(({ ratio }) => {
            if (ratio >= 0 && ratio <= 1) {
              const p = Math.round(ratio * 100);
              progressBar.style.width = `${p}%`;
              progressPercent.innerText = `${p}%`;
            }
          });

          await ffmpeg.load();
          isReady = true;
          console.log('FFmpeg is ready with:', path);
          return;
        } catch (err) {
          console.warn(`嘗試載入 (${path}) 失敗，嘗試下一組來源...`, err);
        }
      }
    }
    setTimeout(initFFmpeg, 300);

    // 動態產生單行 FFmpeg 指令
    function updateCommandLine() {
      const cmdText = document.getElementById('cmdText');
      if (!cmdText) return;

      const splitInput = document.getElementById('splitFile');
      const splitFile = splitInput && splitInput.files ? splitInput.files[0] : null;

      const muxVInput = document.getElementById('muxVideoFile');
      const muxAInput = document.getElementById('muxAudioFile');
      const muxVFile = muxVInput && muxVInput.files ? muxVInput.files[0] : null;
      const muxAFile = muxAInput && muxAInput.files ? muxAInput.files[0] : null;

      if (currentTab === 'muxTab') {
        const vRaw = muxVFile ? (muxVFile.path || muxVFile.name) : '影片.mp4';
        const aRaw = muxAFile ? (muxAFile.path || muxAFile.name) : '聲音.mp3';
        const { fullInput: vIn, fullOutputBase: vOut } = resolvePaths(vRaw, muxVFile, '影片.mp4');
        const { fullInput: aIn } = resolvePaths(aRaw, muxAFile, '聲音.mp3');
        cmdText.innerText = `ffmpeg -hide_banner -loglevel error -stats -y -i "${vIn}" -i "${aIn}" -c:v copy -c:a copy -shortest "${vOut}_merged.mp4"`.trim();
        return;
      }

      // splitTab
      const rawPath = splitFile ? (splitFile.path || splitFile.name) : '影片.mp4';
      const { fullInput: vName, fullOutputBase: base, ext } = resolvePaths(rawPath, splitFile, '影片.mp4');

      const s = parseFloat(sliderStart.value) || 0;
      const e = parseFloat(sliderEnd.value) || 0;
      const max = parseFloat(sliderEnd.max) || 100;
      const hasDur = video && !isNaN(video.duration) && isFinite(video.duration) && video.duration > 0;
      const totalDur = hasDur ? video.duration : max;

      let timePart = '';
      const hasStart = s > 0.05;
      const hasEnd = e > 0 && e < (totalDur - 0.05);

      if (hasStart && hasEnd) {
        timePart = `-ss ${formatTimeCmd(s)} -to ${formatTimeCmd(e)} `;
      } else if (hasStart) {
        timePart = `-ss ${formatTimeCmd(s)} `;
      } else if (hasEnd) {
        timePart = `-to ${formatTimeCmd(e)} `;
      }

      if (activeAction === 'anim' || currentSubMode === 'anim') {
        const width = document.getElementById('animWidth').value;
        const fps = document.getElementById('animFps').value;
        const format = document.getElementById('animFormat').value;
        const scale = width === '-1' ? '' : `scale=${width}:-1:flags=lanczos,`;
        const sPart = hasStart ? `-ss ${formatTimeCmd(s)} ` : '';
        const toPart = hasEnd ? `-to ${formatTimeCmd(e)} ` : '';

        if (format === 'gif') {
          cmdText.innerText = `ffmpeg -hide_banner -loglevel error -stats -y -i "${vName}" ${sPart}${toPart}-filter_complex "[0:v]fps=${fps},${scale}split[a][b];[a]palettegen[p];[b][p]paletteuse" "${base}_anim.gif"`.trim();
        } else {
          const vfFilter = `fps=${fps},${scale}`.replace(/,$/, '');
          cmdText.innerText = `ffmpeg -hide_banner -loglevel error -stats -y -i "${vName}" ${sPart}${toPart}-vf "${vfFilter}" -loop 0 "${base}_anim.webp"`.trim();
        }
      } else if (activeAction === 'audio') {
        cmdText.innerText = `ffmpeg -hide_banner -loglevel error -stats -y -i "${vName}" ${timePart}-vn -c:a copy "${base}_audio.m4a"`.trim();
      } else if (activeAction === 'video') {
        cmdText.innerText = `ffmpeg -hide_banner -loglevel error -stats -y -i "${vName}" ${timePart}-an -c:v copy -avoid_negative_ts make_zero "${base}_mute${ext}"`.trim();
      } else {
        cmdText.innerText = `ffmpeg -hide_banner -loglevel error -stats -y -i "${vName}" ${timePart}-c copy -avoid_negative_ts make_zero "${base}_cut${ext}"`.trim();
      }
    }

    function copyCommandLine() {
      const cmdText = document.getElementById('cmdText').innerText.trim();
      const btn = document.getElementById('btnCopyCmd');
      const showSuccess = () => {
        btn.innerText = '已複製';
        setTimeout(() => { btn.innerText = '複製'; }, 2000);
      };

      if (navigator.clipboard && navigator.clipboard.writeText) {
        navigator.clipboard.writeText(cmdText).then(showSuccess).catch(() => {
          fallbackCopy(cmdText, showSuccess);
        });
      } else {
        fallbackCopy(cmdText, showSuccess);
      }
    }

    function fallbackCopy(text, cb) {
      const ta = document.createElement('textarea');
      ta.value = text;
      ta.style.position = 'fixed';
      ta.style.opacity = '0';
      document.body.appendChild(ta);
      ta.select();
      try {
        document.execCommand('copy');
        if (cb) cb();
      } catch (e) {}
      document.body.removeChild(ta);
    }

    // 主頁籤切換
    function switchMainTab(tabId, btn) {
      currentTab = tabId;
      document.querySelectorAll('.panel').forEach(p => p.classList.remove('active'));
      document.querySelectorAll('.tab-btn').forEach(b => b.classList.remove('active'));
      document.getElementById(tabId).classList.add('active');
      btn.classList.add('active');
      if (tabId === 'muxTab') {
        activeAction = 'mux';
      } else {
        activeAction = currentSubMode === 'anim' ? 'anim' : 'cut';
      }
      hideResult();
      updateCommandLine();
    }

    // 子功能切換 (剪切/抽取 vs 轉動畫)
    function switchSubMode(mode, btn) {
      currentSubMode = mode;
      document.querySelectorAll('.mode-btn').forEach(b => b.classList.remove('active'));
      btn.classList.add('active');
      if (mode === 'cut') {
        document.getElementById('cutActions').style.display = 'block';
        document.getElementById('animActions').style.display = 'none';
        activeAction = 'cut';
      } else {
        document.getElementById('cutActions').style.display = 'none';
        document.getElementById('animActions').style.display = 'block';
        activeAction = 'anim';
      }
      hideResult();
      updateCommandLine();
    }

    // 時間軸控制器
    const video = document.getElementById('splitVideo');
    const sliderStart = document.getElementById('splitSliderStart');
    const sliderEnd = document.getElementById('splitSliderEnd');
    const trackHighlight = document.getElementById('splitTrackHighlight');
    const startInput = document.getElementById('splitStartInput');
    const endInput = document.getElementById('splitEndInput');
    const textDuration = document.getElementById('splitDurationText');

    function updateHighlight() {
      const max = parseFloat(sliderStart.max) || 100;
      const s = parseFloat(sliderStart.value) || 0;
      const e = parseFloat(sliderEnd.value) || 0;
      const leftPercent = (s / max) * 100;
      const widthPercent = ((e - s) / max) * 100;

      trackHighlight.style.left = `${leftPercent}%`;
      trackHighlight.style.width = `${widthPercent}%`;

      if (startInput) startInput.value = formatTime(s);
      if (endInput) endInput.value = formatTime(e);
      textDuration.innerText = `選取長度: ${(e - s).toFixed(1)} 秒`;
      updateCommandLine();
    }

    sliderStart.addEventListener('input', () => {
      let s = parseFloat(sliderStart.value);
      let e = parseFloat(sliderEnd.value);
      if (s > e) {
        s = e;
        sliderStart.value = s;
      }
      if (video && !isNaN(video.duration)) {
        video.currentTime = s;
      }
      updateHighlight();
    });

    sliderEnd.addEventListener('input', () => {
      let s = parseFloat(sliderStart.value);
      let e = parseFloat(sliderEnd.value);
      if (e < s) {
        e = s;
        sliderEnd.value = e;
      }
      if (video && !isNaN(video.duration)) {
        video.currentTime = e;
      }
      updateHighlight();
    });

    if (startInput) {
      startInput.addEventListener('change', () => {
        let sec = parseTimeToSec(startInput.value);
        if (sec > parseFloat(sliderStart.max)) {
          sliderStart.max = sec;
          sliderEnd.max = Math.max(sec, parseFloat(sliderEnd.max));
        }
        let e = parseFloat(sliderEnd.value);
        if (sec > e) sec = e;
        sliderStart.value = sec;
        if (video && !isNaN(video.duration)) video.currentTime = sec;
        updateHighlight();
      });
    }

    if (endInput) {
      endInput.addEventListener('change', () => {
        let sec = parseTimeToSec(endInput.value);
        if (sec > parseFloat(sliderEnd.max)) {
          sliderEnd.max = sec;
          sliderStart.max = sec;
        }
        let s = parseFloat(sliderStart.value);
        if (sec < s) sec = s;
        sliderEnd.value = sec;
        if (video && !isNaN(video.duration)) video.currentTime = sec;
        updateHighlight();
      });
    }

    video.addEventListener('loadedmetadata', () => {
      const dur = video.duration && !isNaN(video.duration) ? video.duration : 100;
      sliderStart.max = dur;
      sliderEnd.max = dur;
      sliderStart.value = 0;
      sliderEnd.value = dur;
      updateHighlight();
    });

    function setMarker(type) {
      const cur = (video && !isNaN(video.currentTime)) ? video.currentTime : 0;
      if (type === 'start') {
        const e = parseFloat(sliderEnd.value);
        sliderStart.value = Math.min(cur, e);
      } else {
        const s = parseFloat(sliderStart.value);
        sliderEnd.value = Math.max(cur, s);
      }
      updateHighlight();
    }

    function previewSegment() {
      const s = parseFloat(sliderStart.value);
      const e = parseFloat(sliderEnd.value);
      if (video && !isNaN(video.duration)) {
        video.currentTime = s;
        video.play();
        const onTime = () => {
          if (video.currentTime >= e) {
            video.pause();
            video.removeEventListener('timeupdate', onTime);
          }
        };
        video.addEventListener('timeupdate', onTime);
      }
    }

    function resetSplitVideo() {
      const input = document.getElementById('splitFile');
      if (input) input.value = '';
      const label = document.getElementById('splitFileName');
      if (label) label.innerText = '';
      if (video) {
        video.pause();
        video.removeAttribute('src');
        video.load();
      }
      const dropGroup = document.getElementById('splitDropGroup');
      if (dropGroup) dropGroup.style.display = 'block';
      const timelineBox = document.getElementById('splitTimelineBox');
      if (timelineBox) timelineBox.style.display = 'none';

      sliderStart.value = 0;
      sliderEnd.value = 100;
      sliderStart.max = 100;
      sliderEnd.max = 100;
      trackHighlight.style.left = '0%';
      trackHighlight.style.width = '100%';
      if (startInput) startInput.value = '00:00.0';
      if (endInput) endInput.value = '00:00.0';
      textDuration.innerText = '選取長度: 0.0 秒';

      hideResult();
      hideProgress();
      updateCommandLine();
    }

    // 檔案拖放綁定
    function setupDropzone(dropId, inputId, labelId, isVideo = false) {
      const dropzone = document.getElementById(dropId);
      const input = document.getElementById(inputId);
      const label = document.getElementById(labelId);

      input.addEventListener('change', () => {
        if (input.files && input.files[0]) {
          const file = input.files[0];
          label.innerText = `${file.name} (${formatBytes(file.size)})`;

          if (isVideo) {
            const dropGroup = document.getElementById('splitDropGroup');
            if (dropGroup) dropGroup.style.display = 'none';
            document.getElementById('splitTimelineBox').style.display = 'block';
            video.src = URL.createObjectURL(file);
          }
          hideResult();
          updateCommandLine();
        }
      });

      ['dragenter', 'dragover'].forEach(name => {
        dropzone.addEventListener(name, (e) => {
          e.preventDefault();
          dropzone.classList.add('dragover');
        });
      });

      ['dragleave'].forEach(name => {
        dropzone.addEventListener(name, (e) => {
          e.preventDefault();
          dropzone.classList.remove('dragover');
        });
      });

      dropzone.addEventListener('drop', (e) => {
        e.preventDefault();
        dropzone.classList.remove('dragover');
        if (e.dataTransfer && e.dataTransfer.files && e.dataTransfer.files.length > 0) {
          input.files = e.dataTransfer.files;
          input.dispatchEvent(new Event('change'));
        }
      });
    }

    setupDropzone('splitDropzone', 'splitFile', 'splitFileName', true);
    setupDropzone('muxVideoDropzone', 'muxVideoFile', 'muxVideoFileName');
    setupDropzone('muxAudioDropzone', 'muxAudioFile', 'muxAudioFileName');

    function showProgress(msg) {
      progressBox.style.display = 'block';
      progressBar.style.width = '0%';
      progressPercent.innerText = '0%';
      progressMessage.innerText = msg;
      hideResult();
    }

    function hideProgress() {
      progressBox.style.display = 'none';
    }

    function showResult(blob, fileName, isMedia = 'video') {
      hideProgress();
      const url = URL.createObjectURL(blob);
      downloadBtn.href = url;
      downloadBtn.download = fileName;
      resultFileSize.innerText = formatBytes(blob.size);

      previewContainer.innerHTML = '';
      if (isMedia === 'image') {
        const img = document.createElement('img');
        img.src = url;
        previewContainer.appendChild(img);
      } else if (isMedia === 'video') {
        const vid = document.createElement('video');
        vid.src = url;
        vid.controls = true;
        previewContainer.appendChild(vid);
      } else if (isMedia === 'audio') {
        const aud = document.createElement('audio');
        aud.src = url;
        aud.controls = true;
        previewContainer.appendChild(aud);
      }

      resultBox.style.display = 'block';
      resultBox.scrollIntoView({ behavior: 'smooth' });
    }

    function hideResult() {
      resultBox.style.display = 'none';
      previewContainer.innerHTML = '';
    }

    // 1-A. 分割 / 拆軌
    async function handleSplit(mode) {
      activeAction = mode === 'both' ? 'cut' : mode;
      updateCommandLine();

      const fileInput = document.getElementById('splitFile');
      if (!fileInput.files || !fileInput.files[0]) { copyCommandLine(); return; }

      const file = fileInput.files[0];
      const limitBytes = 900 * 1024 * 1024;

      if (file.size >= limitBytes) {
        copyCommandLine();
        return;
      }

      if (!isReady) {
        showProgress('正在準備轉檔核心，請稍候...');
        await initFFmpeg();
        if (!isReady) {
          hideProgress();
          copyCommandLine();
          return;
        }
      }
      if (isProcessing) return;

      const ext = getExt(file.name) || '.mp4';
      const baseName = getBaseName(file.name);
      const inputName = `input${ext}`;

      const s = parseFloat(sliderStart.value) || 0;
      const e = parseFloat(sliderEnd.value) || 0;
      const max = parseFloat(sliderEnd.max) || 100;
      const hasDur = video && !isNaN(video.duration) && isFinite(video.duration) && video.duration > 0;
      const totalDur = hasDur ? video.duration : max;
      const hasStart = s > 0.05;
      const hasEnd = e > 0 && e < (totalDur - 0.05);

      isProcessing = true;
      setButtonsDisabled(true);
      showProgress('載入影片資料中...');

      let outName = '';
      let mediaType = 'video';

      if (mode === 'audio') {
        outName = `${baseName}_audio.m4a`;
        mediaType = 'audio';
      } else if (mode === 'video') {
        outName = `${baseName}_mute${ext}`;
        mediaType = 'video';
      } else {
        outName = `${baseName}_cut${ext}`;
        mediaType = 'video';
      }

      try {
        safeUnlink(inputName);
        safeUnlink(outName);

        ffmpeg.FS('writeFile', inputName, await fetchFile(file));

        let args = ['-y', '-i', inputName];
        if (hasStart) args.push('-ss', formatTimeCmd(s));
        if (hasEnd) args.push('-to', formatTimeCmd(e));

        if (mode === 'audio') {
          args.push('-vn', '-c:a', 'copy', outName);
          progressMessage.innerText = '正在抽取聲音...';
        } else if (mode === 'video') {
          args.push('-an', '-c:v', 'copy', '-avoid_negative_ts', 'make_zero', outName);
          progressMessage.innerText = '正在抽取畫面...';
        } else {
          args.push('-c', 'copy', '-avoid_negative_ts', 'make_zero', outName);
          progressMessage.innerText = '正在剪切片段...';
        }

        await ffmpeg.run(...args);

        const data = ffmpeg.FS('readFile', outName);
        const mime = mode === 'audio' ? 'audio/mp4' : (ext === '.webm' ? 'video/webm' : 'video/mp4');
        const blob = new Blob([data.buffer], { type: mime });

        showResult(blob, outName, mediaType);
      } catch (err) {
        console.error(err);
        copyCommandLine();
        copyCommandLine();
        hideProgress();
        if (err.message && err.message.includes('can only run one command')) {
          initFFmpeg();
        }
      } finally {
        safeUnlink(inputName);
        safeUnlink(outName);
        isProcessing = false;
        setButtonsDisabled(false);
      }
    }

    // 1-B. 轉為動畫 (共用選取的影片與時間軸)
    async function handleMakeAnimation() {
      activeAction = 'anim';
      updateCommandLine();

      const fileInput = document.getElementById('splitFile');
      if (!fileInput.files || !fileInput.files[0]) { copyCommandLine(); return; }

      const file = fileInput.files[0];
      const limitBytes = 900 * 1024 * 1024;

      if (file.size >= limitBytes) {
        copyCommandLine();
        return;
      }

      if (!isReady) {
        showProgress('正在準備轉檔核心，請稍候...');
        await initFFmpeg();
        if (!isReady) {
          hideProgress();
          copyCommandLine();
          return;
        }
      }
      if (isProcessing) return;

      const ext = getExt(file.name) || '.mp4';
      const baseName = getBaseName(file.name);
      const inputName = `input_anim${ext}`;

      const s = parseFloat(sliderStart.value) || 0;
      const e = parseFloat(sliderEnd.value) || 0;
      const max = parseFloat(sliderEnd.max) || 100;
      const hasDur = video && !isNaN(video.duration) && isFinite(video.duration) && video.duration > 0;
      const totalDur = hasDur ? video.duration : max;
      const hasStart = s > 0.05;
      const hasEnd = e > 0 && e < (totalDur - 0.05);

      const width = document.getElementById('animWidth').value;
      const fps = document.getElementById('animFps').value;
      const format = document.getElementById('animFormat').value;
      const outName = `${baseName}_anim.${format}`;

      isProcessing = true;
      setButtonsDisabled(true);
      showProgress('載入影片資料中...');

      try {
        safeUnlink(inputName);
        safeUnlink(outName);

        ffmpeg.FS('writeFile', inputName, await fetchFile(file));

        let args = ['-y', '-i', inputName];
        if (hasStart) args.push('-ss', formatTimeCmd(s));
        if (hasEnd) args.push('-to', formatTimeCmd(e));

        const scaleFilter = width === '-1' ? '' : `scale=${width}:-1:flags=lanczos,`;

        if (format === 'gif') {
          progressMessage.innerText = '生成高品質 GIF 中...';
          const filter = `[0:v]fps=${fps},${scaleFilter}split[a][b];[a]palettegen[p];[b][p]paletteuse`;
          args.push('-filter_complex', filter, outName);
        } else {
          progressMessage.innerText = '生成 WebP 動畫中...';
          const filter = `fps=${fps},${scaleFilter}`.replace(/,$/, '');
          args.push('-vf', filter, '-loop', '0', outName);
        }

        await ffmpeg.run(...args);

        const data = ffmpeg.FS('readFile', outName);
        const mime = format === 'gif' ? 'image/gif' : 'image/webp';
        const blob = new Blob([data.buffer], { type: mime });

        showResult(blob, outName, 'image');
      } catch (err) {
        console.error(err);
        copyCommandLine();
        copyCommandLine();
        hideProgress();
        if (err.message && err.message.includes('can only run one command')) {
          initFFmpeg();
        }
      } finally {
        safeUnlink(inputName);
        safeUnlink(outName);
        isProcessing = false;
        setButtonsDisabled(false);
      }
    }

    // 2. 合併影音
    async function handleMux() {
      activeAction = 'mux';
      updateCommandLine();

      const vInput = document.getElementById('muxVideoFile');
      const aInput = document.getElementById('muxAudioFile');

      if (!vInput.files || !vInput.files[0]) { copyCommandLine(); return; }
      if (!aInput.files || !aInput.files[0]) { copyCommandLine(); return; }

      const vFile = vInput.files[0];
      const aFile = aInput.files[0];
      const limitBytes = 900 * 1024 * 1024;

      if (vFile.size >= limitBytes || aFile.size >= limitBytes) {
        copyCommandLine();
        return;
      }

      if (!isReady) {
        showProgress('正在準備轉檔核心，請稍候...');
        await initFFmpeg();
        if (!isReady) {
          hideProgress();
          copyCommandLine();
          return;
        }
      }
      if (isProcessing) return;

      const vExt = getExt(vFile.name) || '.mp4';
      const aExt = getExt(aFile.name) || '.mp3';
      const baseName = getBaseName(vFile.name);

      const inVideoName = `in_v${vExt}`;
      const inAudioName = `in_a${aExt}`;
      const outName = `${baseName}_merged.mp4`;

      isProcessing = true;
      setButtonsDisabled(true);
      showProgress('載入影音資料中...');

      try {
        safeUnlink(inVideoName);
        safeUnlink(inAudioName);
        safeUnlink(outName);

        ffmpeg.FS('writeFile', inVideoName, await fetchFile(vFile));
        ffmpeg.FS('writeFile', inAudioName, await fetchFile(aFile));

        progressMessage.innerText = '合併影音中...';

        const args = [
          '-y',
          '-i', inVideoName,
          '-i', inAudioName,
          '-c:v', 'copy',
          '-c:a', 'copy',
          '-shortest',
          outName
        ];

        await ffmpeg.run(...args);

        const data = ffmpeg.FS('readFile', outName);
        const blob = new Blob([data.buffer], { type: 'video/mp4' });

        showResult(blob, outName, 'video');
      } catch (err) {
        console.error(err);
        copyCommandLine();
        copyCommandLine();
        hideProgress();
        if (err.message && err.message.includes('can only run one command')) {
          initFFmpeg();
        }
      } finally {
        safeUnlink(inVideoName);
        safeUnlink(inAudioName);
        safeUnlink(outName);
        isProcessing = false;
        setButtonsDisabled(false);
      }
    }

    ['animWidth', 'animFps', 'animFormat'].forEach(id => {
      const el = document.getElementById(id);
      if (el) el.addEventListener('change', updateCommandLine);
    });

    updateCommandLine();
  </script>
